[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdef"
version = "0.1.0"
description = "Versioned Data Execution Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "License not yet selected"}
authors = []
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
